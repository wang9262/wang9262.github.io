  (function() {
    const themeBtns = document.querySelectorAll('.theme-btn');
    const root = document.documentElement;
    let switchingTimer = null;
    
    // Update UI function
    function updateThemeUI(theme) {
      themeBtns.forEach(btn => {
        const isMatch = btn.dataset.theme === theme;
        const bg = btn.querySelector('[data-bg]');
        
        if (isMatch) {
          btn.classList.add('text-primary');
          btn.classList.remove('text-text-muted');
          if (bg) {
            bg.classList.remove('opacity-0', 'scale-75');
            bg.classList.add('opacity-100', 'scale-100');
          }
        } else {
          btn.classList.remove('text-primary');
          btn.classList.add('text-text-muted');
          if (bg) {
            bg.classList.add('opacity-0', 'scale-75');
            bg.classList.remove('opacity-100', 'scale-100');
          }
        }
      });
    }
    
    function applyTheme(theme) {
      if (theme === 'system') {
        localStorage.removeItem('color-theme');
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', isDark);
        return;
      }
      localStorage.setItem('color-theme', theme);
      root.classList.toggle('dark', theme === 'dark');
    }

    function withSwitchingLock(fn) {
      if (switchingTimer) {
        window.clearTimeout(switchingTimer);
        switchingTimer = null;
      }
      root.classList.add('theme-switching');
      fn();
      switchingTimer = window.setTimeout(() => {
        root.classList.remove('theme-switching');
        switchingTimer = null;
      }, 220);
    }

    // Set theme function
    function setTheme(theme) {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const apply = () => withSwitchingLock(() => {
        applyTheme(theme);
        updateThemeUI(theme);
      });

      if (!prefersReducedMotion && 'startViewTransition' in document) {
        document.startViewTransition(apply);
        return;
      }

      apply();
    }
    
    // Handle clicks
    themeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setTheme(btn.dataset.theme);
      });
    });
    
    // Initialize theme UI
    const storedTheme = localStorage.getItem('color-theme') || 'system';
    updateThemeUI(storedTheme);
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('color-theme')) {
        document.documentElement.classList.toggle('dark', e.matches);
      }
    });
  })();
