  (function() {
    const themeBtn = document.getElementById('theme-toggle-btn');
    const themeDropdown = document.getElementById('theme-dropdown');
    const themeIcon = document.getElementById('theme-toggle-icon');
    const themeOptions = document.querySelectorAll('.theme-option');
    
    if (!themeBtn || !themeDropdown || !themeIcon) return;
    
    // Toggle dropdown
    themeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      themeDropdown.classList.toggle('hidden');
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!themeBtn.contains(e.target) && !themeDropdown.contains(e.target)) {
        themeDropdown.classList.add('hidden');
      }
    });
    
    // Update UI function
    function updateThemeUI(theme) {
      // Update icon
      themeIcon.className = 'text-lg';
      if (theme === 'light') {
        themeIcon.classList.add('fa-regular', 'fa-lightbulb');
      } else if (theme === 'dark') {
        themeIcon.classList.add('fa-solid', 'fa-moon');
      } else {
        themeIcon.classList.add('fa-solid', 'fa-desktop');
      }
      
      // Update active option
      themeOptions.forEach(option => {
        if (option.dataset.theme === theme) {
          option.classList.add('text-primary', 'font-medium');
        } else {
          option.classList.remove('text-primary', 'font-medium');
        }
      });
    }
    
    // Set theme function
    function setTheme(theme) {
      if (theme === 'system') {
        localStorage.removeItem('color-theme');
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      } else {
        localStorage.setItem('color-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }
      
      updateThemeUI(theme);
      themeDropdown.classList.add('hidden');
    }
    
    // Handle option clicks
    themeOptions.forEach(function(option) {
      option.addEventListener('click', function(e) {
        e.stopPropagation();
        setTheme(option.dataset.theme);
      });
    });
    
    // Initialize theme UI
    const storedTheme = localStorage.getItem('color-theme') || 'system';
    updateThemeUI(storedTheme);
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('color-theme')) {
        document.documentElement.classList.toggle('dark', e.matches);
      }
    });
  })();
