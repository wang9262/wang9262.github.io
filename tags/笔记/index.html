  (() => {
    const root = document.documentElement;
    const options = [...document.querySelectorAll('.theme-switcher__option')];
    const cycles = [...document.querySelectorAll('.theme-switcher__cycle')];
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    let switchingTimer;

    const updateControls = (theme) => {
      options.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
      });
      cycles.forEach((button) => {
        button.dataset.current = theme;
      });
    };

    const applyTheme = (theme) => {
      const isDark = theme === 'dark' || (theme === 'system' && media.matches);
      root.classList.toggle('dark', isDark);
    };

    const setTheme = (theme) => {
      if (theme === 'system') localStorage.removeItem('color-theme');
      else localStorage.setItem('color-theme', theme);

      window.clearTimeout(switchingTimer);
      root.classList.add('theme-switching');

      if (!media.matches && 'startViewTransition' in document && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.startViewTransition(() => {
          applyTheme(theme);
          updateControls(theme);
        });
      } else {
        applyTheme(theme);
        updateControls(theme);
      }

      switchingTimer = window.setTimeout(() => root.classList.remove('theme-switching'), 220);
    };

    options.forEach((button) => {
      button.addEventListener('click', () => setTheme(button.dataset.theme));
    });

    // 移动端空间有限，用单个循环按钮在 浅色 → 深色 → 跟随系统 之间切换。
    const cycleOrder = ['light', 'dark', 'system'];
    cycles.forEach((button) => {
      button.addEventListener('click', () => {
        const current = button.dataset.current || 'system';
        const next = cycleOrder[(cycleOrder.indexOf(current) + 1) % cycleOrder.length];
        setTheme(next);
      });
    });

    media.addEventListener('change', () => {
      if (!localStorage.getItem('color-theme')) applyTheme('system');
    });

    updateControls(localStorage.getItem('color-theme') || 'system');
  })();
